<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>电影院</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="brand">
    <span>TP制作🐈📽️</span>
    <span class="clock" id="clock">--月--日 星期- --:--:--</span>
  </div>

  <div class="screen-wrap">
    <div class="screen-inner">
      <div class="title-bar">
        <span class="now" id="nowPlaying">准备播放</span>
      </div>

      <div class="stage-outer">
        <div class="stage" id="stage">
          <video id="player" playsinline></video>
          <iframe id="ytFrame" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
          <div class="placeholder" id="placeholder">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/>
            </svg>
            <span>选择本地视频或粘贴 YouTube 链接</span>
          </div>
        </div>
      </div>

      <div class="progress-area" id="progressArea">
        <div class="progress-bar" id="progressBar">
          <div class="progress-filled" id="progressFilled"></div>
        </div>
        <div class="time-row">
          <span id="currentTime">0:00</span>
          <span id="duration">0:00</span>
        </div>
      </div>

      <!-- 播放控制条：左（上一个/播放/下一个）· 中（进度条，仅横屏显示）· 右（全屏 → 文件夹列表 → YouTube 链接输入） -->
      <div class="controls">
        <div class="controls-left">
          <button id="prevBtn" title="上一个 (←)" disabled>⏮</button>
          <button class="play" id="playBtn" title="播放/暂停 (空格)">▶</button>
          <button id="nextBtn" title="下一个 (→)" disabled>⏭</button>
        </div>
        <div class="controls-center">
          <div class="progress-bar" id="progressBarLand">
            <div class="progress-filled" id="progressFilledLand"></div>
          </div>
          <div class="time-inline">
            <span id="currentTimeLand">0:00</span>
            <span>/</span>
            <span id="durationLand">0:00</span>
          </div>
        </div>
        <div class="controls-right">
          <button id="fsBtn" class="fs-btn" title="全屏 (F)">⛶</button>
          <button id="toggleListBtn" class="folder-btn" title="本地列表">📁</button>
          <div class="url-inline">
            <input type="url" id="urlInput" placeholder="YouTube 链接" />
            <button id="playUrlBtn" title="播放链接">▶</button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="list-panel" id="listPanel">
    <h3>本地视频 · 1.mp4 ~ 56.mp4</h3>
    <div class="grid" id="grid"></div>
    <div class="status" id="status"></div>
  </div>


  <!-- 按功能拆分为多个脚本，普通 <script>（非 module）以便 file:// 双击直接可用；
       彼此通过顶层变量/函数共享作用域，因此加载顺序不可打乱 -->
  <script src="state.js"></script>
  <script src="db.js"></script>
  <script src="utils.js"></script>
  <script src="thumbnail.js"></script>
  <script src="player.js"></script>
  <script src="cards.js"></script>
  <script src="events.js"></script>
  <script src="main.js"></script>
</body>
</html>
