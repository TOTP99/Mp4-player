<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#05070b" />
  <title>电影院</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="brand">
    <span>TP制作🐈📽️</span>
    <span class="clock" id="clock">--月--日 星期- --:--:--</span>
  </div>

  <div class="screen-wrap">
    <span class="corner corner-tl" aria-hidden="true"></span>
    <span class="corner corner-tr" aria-hidden="true"></span>
    <span class="corner corner-bl" aria-hidden="true"></span>
    <span class="corner corner-br" aria-hidden="true"></span>
    <div class="screen-inner">
      <div class="title-bar">
        <span class="now" id="nowPlaying">准备播放</span>
        <span class="pos" id="posInfo" hidden></span>
      </div>

      <div class="stage-outer">
        <div class="stage" id="stage">
          <video id="player" playsinline preload="metadata"></video>
          <iframe id="ytFrame" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
          <div class="placeholder" id="placeholder">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/>
            </svg>
            <span>选择视频或粘贴 YouTube 链接</span>
          </div>
        </div>
      </div>

      <div class="progress-area" id="progressArea">
        <div class="progress-bar" id="progressBar">
          <div class="progress-filled" id="progressFilled"></div>
        </div>
        <div class="time-row">
          <span id="currentTime">0:00</span>
          <span id="duration">0:00</span>
        </div>
      </div>

      <div class="controls">
        <div class="controls-left btn-group">
          <button id="prevBtn" title="上一个 (←)" disabled>⏮</button>
          <button class="play" id="playBtn" title="播放/暂停 (空格)">▶</button>
          <button id="nextBtn" title="下一个 (→)" disabled>⏭</button>
        </div>
        <div class="controls-center">
          <div class="progress-bar" id="progressBarLand">
            <div class="progress-filled" id="progressFilledLand"></div>
          </div>
          <div class="time-inline">
            <span id="currentTimeLand">0:00</span>
            <span>/</span>
            <span id="durationLand">0:00</span>
          </div>
        </div>
        <div class="controls-right">
          <div class="btn-group">
            <button id="fsBtn" class="fs-btn" title="全屏 (F)">⛶</button>
            <button id="refreshBtn" title="刷新视频列表 (R)">🔄</button>
            <button id="toggleListBtn" class="folder-btn" title="视频列表">📁</button>
          </div>
        </div>
      </div>

      <div class="url-row">
        <input type="url" id="urlInput" placeholder="粘贴 YouTube 链接" autocomplete="off" />
        <button id="playUrlBtn" title="播放链接">▶</button>
      </div>
    </div>
  </div>

  <div class="list-panel" id="listPanel">
    <h3>远程视频 · 1.mp4 ~ 56.mp4</h3>
    <div class="scan-bar" id="scanBar" aria-hidden="true"><span></span></div>
    <div class="grid" id="grid"></div>
    <div class="status" id="status"></div>
  </div>

  <!-- 加载顺序不可打乱：顶层共享作用域，支持 file:// 或任意静态托管 -->
  <script src="state.js"></script>
  <script src="db.js"></script>
  <script src="utils.js"></script>
  <script src="thumbnail.js"></script>
  <script src="player.js"></script>
  <script src="cards.js"></script>
  <script src="events.js"></script>
  <script src="main.js"></script>
</body>
</html>
