<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>电影院</title>
  <style>
    :root {
      --bg: #0a0e14;
      --surface: #111820;
      --card: #151c26;
      --border: #1e2a3a;
      --text: #d8e1ec;
      --muted: #6b7c90;
      --accent: #5b9fd4;
      --accent-hover: #7bb3de;
      --gold: #c4a35a;
      --gold-dim: #8a7340;
      --radius: 4px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 14px 48px;
    }

    /* 工具栏 */
    .toolbar {
      width: 100%;
      max-width: 900px;
      display: flex;
      gap: 8px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }

    .toolbar input {
      flex: 1;
      min-width: 180px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 9px 12px;
      color: var(--text);
      font-size: 0.88rem;
      outline: none;
    }

    .toolbar input:focus { border-color: var(--accent); }
    .toolbar input::placeholder { color: #4a5a6c; }

    .toolbar button {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 9px 14px;
      font-size: 0.85rem;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s, border-color 0.15s;
      color: var(--text);
      background: var(--surface);
    }

    .toolbar button:hover {
      background: #1a2430;
      border-color: var(--accent);
    }

    .toolbar .btn-primary {
      background: transparent;
      border-color: var(--gold-dim);
      color: var(--gold);
    }

    .toolbar .btn-primary:hover {
      border-color: var(--gold);
      background: rgba(196, 163, 90, 0.08);
    }

    /* 屏幕外框：细金色边 */
    .screen-wrap {
      width: 100%;
      max-width: 900px;
      border: 1px solid var(--gold);
      border-radius: 2px;
      padding: 3px;
      background: #0c1016;
      box-shadow: 0 0 0 1px rgba(196, 163, 90, 0.25);
    }

    .screen-inner {
      background: #080c12;
      border: 1px solid rgba(196, 163, 90, 0.35);
      overflow: hidden;
    }

    .title-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      font-size: 0.8rem;
      color: var(--muted);
    }

    .title-bar .now {
      color: var(--text);
      font-weight: 500;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      letter-spacing: 0.02em;
    }

    /* 舞台：固定比例，视频尽量一致大小 */
    .stage-outer {
      position: relative;
      overflow: hidden;
      background: #000;
    }

    .stage {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      transform-origin: center center;
      transition: transform 0.2s ease;
    }

    .stage video,
    .stage iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: none;
      background: #000;
      object-fit: contain; /* 保持比例，尽量占满 */
    }

    .stage .placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: #3a4a5c;
      font-size: 0.85rem;
    }

    .stage .placeholder svg {
      width: 44px;
      height: 44px;
      opacity: 0.4;
    }

    /* 进度 */
    .progress-area {
      padding: 0 12px 6px;
      background: var(--surface);
      display: none;
    }

    .progress-area.show { display: block; }

    .progress-bar {
      height: 3px;
      background: var(--border);
      border-radius: 1px;
      cursor: pointer;
    }

    .progress-bar:hover { height: 4px; }

    .progress-filled {
      height: 100%;
      width: 0;
      background: var(--accent);
      border-radius: 1px;
    }

    .time-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.68rem;
      color: var(--muted);
      margin-top: 4px;
      font-variant-numeric: tabular-nums;
    }

    /* 控制条 */
    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 10px 12px 12px;
      background: var(--surface);
      border-top: 1px solid var(--border);
    }

    .controls button {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text);
      font-size: 0.95rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color 0.15s, background 0.15s, transform 0.1s;
    }

    .controls button:hover {
      border-color: var(--accent);
      background: rgba(91, 159, 212, 0.08);
    }

    .controls button:active { transform: scale(0.94); }
    .controls button:disabled {
      opacity: 0.28;
      cursor: not-allowed;
    }

    .controls .play {
      width: 48px;
      height: 48px;
      border-color: var(--gold-dim);
      color: var(--gold);
      font-size: 1.1rem;
    }

    .controls .play:hover {
      border-color: var(--gold);
      background: rgba(196, 163, 90, 0.1);
    }

    .controls .zoom-group {
      display: flex;
      gap: 6px;
      margin-left: 8px;
      padding-left: 12px;
      border-left: 1px solid var(--border);
    }

    .hint {
      margin-top: 10px;
      text-align: center;
      color: #2e3c4c;
      font-size: 0.68rem;
    }

    /* 列表 */
    .list-panel {
      width: 100%;
      max-width: 900px;
      margin-top: 20px;
      display: none;
    }

    .list-panel.open { display: block; }

    .list-panel h3 {
      font-size: 0.78rem;
      color: var(--muted);
      margin-bottom: 10px;
      font-weight: 500;
      letter-spacing: 0.04em;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 10px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      cursor: pointer;
      transition: border-color 0.15s;
    }

    .card:hover,
    .card.active { border-color: var(--gold-dim); }

    .card.active { border-color: var(--gold); }

    .card .thumb {
      position: relative;
      aspect-ratio: 16 / 9;
      background: #000;
    }

    .card .thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .card .thumb .num {
      position: absolute;
      top: 3px;
      left: 3px;
      background: rgba(0,0,0,0.65);
      color: #ccc;
      font-size: 0.62rem;
      padding: 1px 5px;
      border-radius: 2px;
    }

    .card .name {
      padding: 5px 7px;
      font-size: 0.72rem;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .status {
      margin-top: 8px;
      font-size: 0.75rem;
      color: var(--muted);
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="toolbar">
    <input type="url" id="urlInput" placeholder="粘贴 YouTube 链接，或留空播放本地视频" />
    <button class="btn-primary" id="playUrlBtn">播放链接</button>
    <button id="toggleListBtn">本地列表</button>
  </div>

  <div class="screen-wrap">
    <div class="screen-inner">
      <div class="title-bar">
        <span class="now" id="nowPlaying">准备播放</span>
      </div>

      <div class="stage-outer">
        <div class="stage" id="stage">
          <video id="player" playsinline></video>
          <iframe id="ytFrame" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
          <div class="placeholder" id="placeholder">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/>
            </svg>
            <span>选择本地视频或粘贴 YouTube 链接</span>
          </div>
        </div>
      </div>

      <div class="progress-area" id="progressArea">
        <div class="progress-bar" id="progressBar">
          <div class="progress-filled" id="progressFilled"></div>
        </div>
        <div class="time-row">
          <span id="currentTime">0:00</span>
          <span id="duration">0:00</span>
        </div>
      </div>

      <div class="controls">
        <button id="prevBtn" title="上一个 (←)" disabled>⏮</button>
        <button class="play" id="playBtn" title="播放/暂停 (空格)">▶</button>
        <button id="nextBtn" title="下一个 (→)" disabled>⏭</button>
        <div class="zoom-group">
          <button id="zoomOutBtn" title="缩小 (−)">−</button>
          <button id="zoomInBtn" title="放大 (+)">+</button>
          <button id="zoomResetBtn" title="重置缩放">1:1</button>
        </div>
      </div>
    </div>
  </div>
  <div class="hint">空格 播放/暂停 · ← → 切换 · + − 缩放</div>

  <div class="list-panel" id="listPanel">
    <h3>本地视频 · 1.mp4 ~ 56.mp4</h3>
    <div class="grid" id="grid"></div>
    <div class="status" id="status"></div>
  </div>

  <script>
    (() => {
      const MAX = 56;
      const DB_NAME = 'cinema_db';
      const DB_VER = 1;
      const THUMB_MAX_W = 320;
      const THUMB_QUALITY = 0.55;
      const ZOOM_MIN = 0.5;
      const ZOOM_MAX = 2.5;
      const ZOOM_STEP = 0.15;

      const $ = id => document.getElementById(id);
      const urlInput = $('urlInput');
      const playUrlBtn = $('playUrlBtn');
      const toggleListBtn = $('toggleListBtn');
      const listPanel = $('listPanel');
      const grid = $('grid');
      const status = $('status');
      const player = $('player');
      const ytFrame = $('ytFrame');
      const placeholder = $('placeholder');
      const nowPlaying = $('nowPlaying');
      const playBtn = $('playBtn');
      const prevBtn = $('prevBtn');
      const nextBtn = $('nextBtn');
      const progressArea = $('progressArea');
      const progressBar = $('progressBar');
      const progressFilled = $('progressFilled');
      const currentTimeEl = $('currentTime');
      const durationEl = $('duration');
      const stage = $('stage');
      const zoomInBtn = $('zoomInBtn');
      const zoomOutBtn = $('zoomOutBtn');
      const zoomResetBtn = $('zoomResetBtn');

      let videoList = [];
      let currentIndex = -1;
      let mode = null;
      let zoom = 1;
      const captured = new Set();
      let db = null;

      // ========== IndexedDB ==========
      function openDB() {
        return new Promise((resolve, reject) => {
          const req = indexedDB.open(DB_NAME, DB_VER);
          req.onupgradeneeded = e => {
            const database = e.target.result;
            if (!database.objectStoreNames.contains('thumbs')) database.createObjectStore('thumbs');
            if (!database.objectStoreNames.contains('state')) database.createObjectStore('state');
          };
          req.onsuccess = e => resolve(e.target.result);
          req.onerror = e => reject(e.target.error);
        });
      }

      function idbGet(store, key) {
        return new Promise((resolve, reject) => {
          if (!db) return resolve(null);
          const tx = db.transaction(store, 'readonly');
          const req = tx.objectStore(store).get(key);
          req.onsuccess = () => resolve(req.result ?? null);
          req.onerror = () => reject(req.error);
        });
      }

      function idbSet(store, key, value) {
        return new Promise((resolve, reject) => {
          if (!db) return resolve();
          const tx = db.transaction(store, 'readwrite');
          const req = tx.objectStore(store).put(value, key);
          req.onsuccess = () => resolve();
          req.onerror = () => reject(req.error);
        });
      }

      async function getThumb(name) {
        try {
          const blob = await idbGet('thumbs', name);
          return blob ? URL.createObjectURL(blob) : null;
        } catch { return null; }
      }

      async function saveThumb(name, dataUrl) {
        try {
          const res = await fetch(dataUrl);
          const blob = await res.blob();
          await idbSet('thumbs', name, blob);
        } catch (e) { console.warn('saveThumb', e); }
      }

      async function saveState() {
        if (mode !== 'local' || currentIndex < 0) return;
        try {
          await idbSet('state', 'playback', {
            file: videoList[currentIndex],
            time: player.currentTime || 0
          });
        } catch {}
      }

      async function loadState() {
        try { return await idbGet('state', 'playback'); }
        catch { return null; }
      }

      // ========== 工具 ==========
      const fmt = sec => {
        if (!isFinite(sec)) return '0:00';
        const m = Math.floor(sec / 60);
        const s = Math.floor(sec % 60);
        return m + ':' + String(s).padStart(2, '0');
      };

      const ytId = url => {
        if (!url) return null;
        const m = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([a-zA-Z0-9_-]{11})/);
        return m ? m[1] : null;
      };

      // ========== 缩放 ==========
      const applyZoom = () => {
        stage.style.transform = `scale(${zoom})`;
      };

      const zoomIn = () => {
        zoom = Math.min(ZOOM_MAX, +(zoom + ZOOM_STEP).toFixed(2));
        applyZoom();
      };

      const zoomOut = () => {
        zoom = Math.max(ZOOM_MIN, +(zoom - ZOOM_STEP).toFixed(2));
        applyZoom();
      };

      const zoomReset = () => {
        zoom = 1;
        applyZoom();
      };

      // ========== 截图 ==========
      const capture = () => {
        try {
          if (!player.videoWidth) return null;
          const scale = Math.min(1, THUMB_MAX_W / player.videoWidth);
          const w = Math.round(player.videoWidth * scale);
          const h = Math.round(player.videoHeight * scale);
          const c = document.createElement('canvas');
          c.width = w;
          c.height = h;
          c.getContext('2d').drawImage(player, 0, 0, w, h);
          return c.toDataURL('image/jpeg', THUMB_QUALITY);
        } catch { return null; }
      };

      const tryCapture = async () => {
        if (mode !== 'local' || currentIndex < 0) return;
        const name = videoList[currentIndex];
        if (captured.has(name) || player.currentTime < 0.8) return;

        captured.add(name);
        const dataUrl = capture();
        if (!dataUrl) { captured.delete(name); return; }

        await saveThumb(name, dataUrl);
        const card = grid.querySelector(`[data-file="${name}"]`);
        if (!card) return;
        const thumb = card.querySelector('.thumb');
        let img = thumb.querySelector('img');
        if (!img) {
          const ph = thumb.querySelector('.ph');
          if (ph) ph.remove();
          img = document.createElement('img');
          thumb.insertBefore(img, thumb.querySelector('.num'));
        }
        const url = await getThumb(name);
        if (url) img.src = url;
      };

      // ========== 显示 ==========
      const hideAll = () => {
        player.style.display = 'none';
        ytFrame.style.display = 'none';
        placeholder.style.display = 'none';
      };

      const showLocal = () => {
        hideAll();
        player.style.display = 'block';
        progressArea.classList.add('show');
        mode = 'local';
      };

      const showYT = id => {
        player.pause();
        player.removeAttribute('src');
        player.load();
        hideAll();
        progressArea.classList.remove('show');
        ytFrame.style.display = 'block';
        ytFrame.src = `https://www.youtube.com/embed/${id}?autoplay=1&rel=0`;
        mode = 'youtube';
        currentIndex = -1;
        prevBtn.disabled = true;
        nextBtn.disabled = true;
        playBtn.textContent = '▶';
        grid.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
      };

      const openLocal = (index, restoreTime) => {
        if (index < 0 || index >= videoList.length) return;
        currentIndex = index;
        const file = videoList[index];

        showLocal();
        player.src = file;
        nowPlaying.textContent = file;
        prevBtn.disabled = index <= 0;
        nextBtn.disabled = index >= videoList.length - 1;

        grid.querySelectorAll('.card').forEach(c => {
          c.classList.toggle('active', c.dataset.file === file);
        });

        const onMeta = () => {
          player.removeEventListener('loadedmetadata', onMeta);
          if (typeof restoreTime === 'number' && restoreTime > 0 && restoreTime < player.duration) {
            player.currentTime = restoreTime;
          }
          player.play().catch(() => {});
        };
        player.addEventListener('loadedmetadata', onMeta);
      };

      const togglePlay = () => {
        if (mode !== 'local') return;
        player.paused ? player.play().catch(() => {}) : player.pause();
      };

      const playPrev = () => {
        if (currentIndex > 0) { saveState(); openLocal(currentIndex - 1); }
      };

      const playNext = () => {
        if (currentIndex < videoList.length - 1) { saveState(); openLocal(currentIndex + 1); }
      };

      // ========== 卡片 ==========
      const createCard = async name => {
        const card = document.createElement('div');
        card.className = 'card';
        card.dataset.file = name;

        const thumb = document.createElement('div');
        thumb.className = 'thumb';

        const cached = await getThumb(name);
        if (cached) {
          captured.add(name);
          const img = document.createElement('img');
          img.src = cached;
          thumb.appendChild(img);
        } else {
          const ph = document.createElement('div');
          ph.className = 'ph';
          ph.style.cssText = 'width:100%;height:100%;background:#0a0e14;display:flex;align-items:center;justify-content:center;color:#3a4a5c;font-size:0.65rem;';
          ph.textContent = '播放后截图';
          thumb.appendChild(ph);
        }

        const num = document.createElement('div');
        num.className = 'num';
        num.textContent = name.replace(/\.mp4$/i, '');
        thumb.appendChild(num);

        const label = document.createElement('div');
        label.className = 'name';
        label.textContent = name;

        card.append(thumb, label);
        card.addEventListener('click', () => {
          const i = videoList.indexOf(name);
          if (i >= 0) openLocal(i);
        });
        return card;
      };

      // ========== 事件 ==========
      playUrlBtn.addEventListener('click', () => {
        const id = ytId(urlInput.value.trim());
        if (!id) return alert('无法识别 YouTube 链接');
        nowPlaying.textContent = 'YouTube · ' + id;
        showYT(id);
      });

      urlInput.addEventListener('keydown', e => {
        if (e.key === 'Enter') playUrlBtn.click();
      });

      toggleListBtn.addEventListener('click', () => {
        const open = listPanel.classList.toggle('open');
        toggleListBtn.textContent = open ? '收起列表' : '本地列表';
      });

      playBtn.addEventListener('click', togglePlay);
      prevBtn.addEventListener('click', playPrev);
      nextBtn.addEventListener('click', playNext);
      zoomInBtn.addEventListener('click', zoomIn);
      zoomOutBtn.addEventListener('click', zoomOut);
      zoomResetBtn.addEventListener('click', zoomReset);

      player.addEventListener('play', () => { playBtn.textContent = '⏸'; });
      player.addEventListener('pause', () => {
        playBtn.textContent = '▶';
        saveState();
        tryCapture();
      });
      player.addEventListener('ended', () => {
        playBtn.textContent = '▶';
        tryCapture();
      });
      player.addEventListener('timeupdate', () => {
        const pct = player.duration ? (player.currentTime / player.duration) * 100 : 0;
        progressFilled.style.width = pct + '%';
        currentTimeEl.textContent = fmt(player.currentTime);
        tryCapture();
      });
      player.addEventListener('loadedmetadata', () => {
        durationEl.textContent = fmt(player.duration);
      });

      progressBar.addEventListener('click', e => {
        if (mode !== 'local') return;
        const rect = progressBar.getBoundingClientRect();
        player.currentTime = ((e.clientX - rect.left) / rect.width) * (player.duration || 0);
      });

      setInterval(saveState, 5000);

      document.addEventListener('keydown', e => {
        if (e.target.tagName === 'INPUT') return;
        switch (e.key) {
          case ' ':
          case 'k':
          case 'K':
            e.preventDefault();
            togglePlay();
            break;
          case 'ArrowLeft':
            e.preventDefault();
            playPrev();
            break;
          case 'ArrowRight':
            e.preventDefault();
            playNext();
            break;
          case '+':
          case '=':
            e.preventDefault();
            zoomIn();
            break;
          case '-':
          case '_':
            e.preventDefault();
            zoomOut();
            break;
          case '0':
            e.preventDefault();
            zoomReset();
            break;
        }
      });

      // ========== 扫描 ==========
      const exists = src => new Promise(resolve => {
        const v = document.createElement('video');
        v.preload = 'metadata';
        v.muted = true;
        v.playsInline = true;
        const done = ok => {
          v.removeAttribute('src');
          v.load();
          resolve(ok);
        };
        v.addEventListener('loadedmetadata', () => done(true));
        v.addEventListener('error', () => done(false));
        setTimeout(() => done(false), 3000);
        v.src = src;
      });

      (async () => {
        try { db = await openDB(); } catch (e) { console.warn('IndexedDB', e); }

        const tasks = Array.from({ length: MAX }, (_, i) => {
          const name = (i + 1) + '.mp4';
          return exists(name).then(ok => (ok ? name : null));
        });
        videoList = (await Promise.all(tasks)).filter(Boolean);

        if (!videoList.length) {
          status.textContent = '未发现本地视频（请命名为 1.mp4 ~ 56.mp4）';
          return;
        }

        status.textContent = '共 ' + videoList.length + ' 个本地视频';
        grid.innerHTML = '';
        const cards = await Promise.all(videoList.map(createCard));
        cards.forEach(c => grid.appendChild(c));

        const state = await loadState();
        if (state?.file && videoList.includes(state.file)) {
          openLocal(videoList.indexOf(state.file), state.time);
        } else {
          openLocal(0);
        }
      })();
    })();
  </script>
</body>
</html>
