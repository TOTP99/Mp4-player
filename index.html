<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#05070b" />
  <title>电影院</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="brand">
    <span class="brand-mark">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="6" width="13" height="12" rx="2"/><path d="M15.5 10.5l6-3.5v10l-6-3.5"/><circle cx="7" cy="10" r="0.6" fill="currentColor"/><circle cx="11" cy="10" r="0.6" fill="currentColor"/><circle cx="7" cy="14" r="0.6" fill="currentColor"/><circle cx="11" cy="14" r="0.6" fill="currentColor"/></svg>
      TP制作
    </span>
    <span class="clock" id="clock">--月--日 星期- --:--:--</span>
  </div>

  <div class="screen-wrap">
    <span class="corner corner-tl" aria-hidden="true"></span>
    <span class="corner corner-tr" aria-hidden="true"></span>
    <span class="corner corner-bl" aria-hidden="true"></span>
    <span class="corner corner-br" aria-hidden="true"></span>
    <div class="screen-inner">
      <div class="title-bar">
        <span class="now" id="nowPlaying">准备播放</span>
        <span class="pos" id="posInfo" hidden></span>
      </div>

      <div class="stage-outer">
        <div class="stage" id="stage">
          <video id="player" playsinline preload="metadata"></video>
          <iframe id="ytFrame" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
          <div class="placeholder" id="placeholder">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/>
            </svg>
            <span>选择视频或粘贴 YouTube 链接</span>
          </div>
          <div class="video-error" id="videoError" hidden>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5"/><circle cx="12" cy="16.4" r="0.7" fill="currentColor" stroke="none"/></svg>
            <span id="videoErrorText">视频加载失败</span>
            <button type="button" id="retryBtn">重试</button>
          </div>
        </div>
      </div>

      <div class="progress-area" id="progressArea">
        <div class="progress-bar" id="progressBar">
          <div class="progress-filled" id="progressFilled"></div>
        </div>
        <div class="time-row">
          <span id="currentTime">0:00</span>
          <span id="duration">0:00</span>
        </div>
      </div>

      <div class="controls">
        <div class="controls-left btn-group">
          <button class="play" id="playBtn" title="播放/暂停 (空格)"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></button>
          <button id="loopBtn" class="mid-btn" title="顺序循环（关）">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="17 1 21 5 17 9"></polyline>
              <path d="M3 11V9a4 4 0 0 1 4-4h14"></path>
              <polyline points="7 23 3 19 7 15"></polyline>
              <path d="M21 13v2a4 4 0 0 1-4 4H3"></path>
            </svg>
          </button>
          <button id="shuffleBtn" class="mid-btn shuffle-btn" title="随机播放（关）">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="16 3 21 3 21 8"></polyline>
              <line x1="4" y1="20" x2="21" y2="3"></line>
              <polyline points="21 16 21 21 16 21"></polyline>
              <line x1="15" y1="15" x2="21" y2="21"></line>
              <line x1="4" y1="4" x2="9" y2="9"></line>
            </svg>
          </button>
        </div>
        <div class="controls-center">
          <div class="progress-bar" id="progressBarLand">
            <div class="progress-filled" id="progressFilledLand"></div>
          </div>
          <div class="time-inline">
            <span id="currentTimeLand">0:00</span>
            <span>/</span>
            <span id="durationLand">0:00</span>
          </div>
        </div>
        <div class="controls-right">
          <div class="btn-group">
            <button id="audioEnhanceBtn" class="enhance-btn active" title="音质增强（开）：降噪 + 响度平衡">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 3v18M8 8v8M16 6v12M4 11v2M20 10v4"/>
              </svg>
            </button>
            <button id="fsBtn" class="fs-btn" title="全屏 (F)">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
              </svg>
            </button>
            <button id="refreshBtn" title="刷新视频列表 (R)">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="23 4 23 10 17 10"></polyline>
                <polyline points="1 20 1 14 7 14"></polyline>
                <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
              </svg>
            </button>
            <button id="toggleListBtn" class="folder-btn" title="视频列表">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="8" y1="6" x2="21" y2="6"></line>
                <line x1="8" y1="12" x2="21" y2="12"></line>
                <line x1="8" y1="18" x2="21" y2="18"></line>
                <line x1="3" y1="6" x2="3.01" y2="6"></line>
                <line x1="3" y1="12" x2="3.01" y2="12"></line>
                <line x1="3" y1="18" x2="3.01" y2="18"></line>
              </svg>
            </button>
            <button id="thumbBtn" title="设为代表图">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
                <circle cx="12" cy="13" r="4"></circle>
              </svg>
            </button>
          </div>
        </div>
      </div>

      <div class="url-row">
        <input type="url" id="urlInput" placeholder="粘贴 YouTube 链接" autocomplete="off" />
        <button id="playUrlBtn" title="播放链接"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></button>
      </div>
    </div>
  </div>

  <div class="list-panel" id="listPanel">
    <h3 id="listTitle">远程视频</h3>
    <div class="scan-bar" id="scanBar" aria-hidden="true"><span></span></div>
    <div class="grid" id="grid"></div>
    <div class="status" id="status"></div>
  </div>

  <!-- 加载顺序不可打乱：顶层共享作用域，支持 file:// 或任意静态托管 -->
  <script src="state.js"></script>
  <script src="db.js"></script>
  <script src="utils.js"></script>
  <script src="audio-enhance.js"></script>
  <script src="thumbnail.js"></script>
  <script src="player.js"></script>
  <script src="cards.js"></script>
  <script src="events.js"></script>
  <script src="main.js"></script>
</body>
</html>
