<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>电影院</title>
  <style>
    :root {
      --bg: #0a0e14;
      --surface: #111820;
      --card: #151c26;
      --border: #1e2a3a;
      --text: #d8e1ec;
      --muted: #6b7c90;
      --accent: #5b9fd4;
      --accent-hover: #7bb3de;
      --gold: #c4a35a;
      --gold-dim: #8a7340;
      --radius: 4px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px 10px 28px;
    }

    /* 品牌栏：左品牌名，右日期时间，与下方 title-bar 的"准备播放"文字左边缘对齐 */
    .brand {
      width: 100%;
      max-width: 900px;
      margin-bottom: 10px;
      padding: 0 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.72rem;
      font-weight: 300;
      letter-spacing: 0.06em;
      color: var(--gold);
    }
    .brand .clock {
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.04em;
      white-space: nowrap;
    }

    /* 仅视频外沿金色细线 */
    .screen-wrap {
      width: 100%;
      max-width: 900px;
      border: 1px solid var(--gold);
      border-radius: 0;
      padding: 0;
      background: #000;
      box-shadow: none;
    }

    .screen-inner {
      background: #000;
      border: none;
      overflow: hidden;
    }

    .title-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 10px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      font-size: 0.75rem;
      color: var(--muted);
    }

    .title-bar .now {
      color: var(--text);
      font-weight: 500;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      letter-spacing: 0.02em;
    }

    .stage-outer {
      position: relative;
      overflow: hidden;
      background: #000;
    }

    .stage {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
    }

    .stage video,
    .stage iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: none;
      background: #000;
      object-fit: contain;
    }

    .stage .placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: #3a4a5c;
      font-size: 0.8rem;
    }

    .stage .placeholder svg {
      width: 40px;
      height: 40px;
      opacity: 0.4;
    }

    .progress-area {
      padding: 4px 10px 2px;
      background: var(--surface);
      display: none;
    }

    .progress-area.show { display: block; }

    .progress-bar {
      position: relative;
      height: 3px;
      background: var(--border);
      border-radius: 1px;
      cursor: pointer;
      touch-action: none;
      /* 扩大可点/拖区域 */
      margin: 6px 0;
    }

    .progress-bar::before {
      content: '';
      position: absolute;
      left: 0; right: 0;
      top: 50%;
      transform: translateY(-50%);
      height: 20px;
    }

    .progress-bar:hover,
    .progress-bar.is-dragging {
      height: 5px;
    }

    .progress-filled {
      position: relative;
      height: 100%;
      width: 0;
      background: var(--accent);
      border-radius: 1px;
      pointer-events: none;
    }

    .progress-filled::after {
      content: '';
      position: absolute;
      right: -6px;
      top: 50%;
      width: 12px;
      height: 12px;
      margin-top: -6px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 2px rgba(10, 14, 20, 0.9);
      opacity: 0;
      transition: opacity 0.12s;
    }

    .progress-bar:hover .progress-filled::after,
    .progress-bar.is-dragging .progress-filled::after {
      opacity: 1;
    }

    .time-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.65rem;
      color: var(--muted);
      margin-top: 3px;
      font-variant-numeric: tabular-nums;
    }

    /* 控制条：纯 emoji，无圆圈边框 */
    .controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: nowrap;
      gap: 6px;
      padding: 6px 8px 8px;
      background: var(--surface);
      border-top: 1px solid var(--border);
    }

    .controls-left {
      display: flex;
      align-items: center;
      gap: 2px;
      flex-shrink: 0;
    }

    .controls-right {
      display: flex;
      align-items: center;
      gap: 2px;
      flex: 1;
      min-width: 0;
      justify-content: flex-end;
    }

    /* 全屏：与"下一个"之间空隙更大 */
    .fs-btn { margin-left: 16px; }

    /* 文件夹（列表）按钮：紧跟全屏之后 */
    .folder-btn { margin-left: 6px; }

    /* YouTube 链接输入区：与文件夹按钮之间空隙更大 */
    .url-inline {
      display: flex;
      align-items: center;
      gap: 4px;
      margin-left: 18px;
      flex: 1;
      min-width: 54px;
      max-width: 240px;
    }

    .url-inline input {
      flex: 1;
      min-width: 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 5px 7px;
      color: var(--text);
      font-size: 0.72rem;
      outline: none;
    }

    .url-inline input:focus { border-color: var(--accent); }
    .url-inline input::placeholder { color: #4a5a6c; }

    .url-inline button {
      flex-shrink: 0;
      min-width: 28px;
      min-height: 28px;
      font-size: 1rem;
      padding: 2px;
      color: var(--gold);
    }

    .controls-center {
      display: none; /* 竖屏进度仍在上方；横屏再显示 */
      flex: 1;
      align-items: center;
      min-width: 0;
      padding: 0 6px;
    }

    .controls-center .progress-bar {
      flex: 1;
      height: 3px;
      background: var(--border);
      border-radius: 1px;
      cursor: pointer;
      touch-action: none;
      margin: 4px 0;
    }

    .controls-center .progress-filled {
      height: 100%;
      width: 0;
      background: var(--accent);
      border-radius: 1px;
    }

    .controls-center .time-inline {
      display: flex;
      gap: 4px;
      font-size: 0.62rem;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      margin-left: 8px;
      flex-shrink: 0;
    }

    .controls button {
      width: auto;
      height: auto;
      min-width: 36px;
      min-height: 36px;
      border-radius: 0;
      border: none;
      background: transparent;
      color: var(--text);
      font-size: 1.25rem;
      line-height: 1;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 6px 4px;
      transition: opacity 0.15s, transform 0.1s;
      -webkit-tap-highlight-color: transparent;
    }

    .controls button:hover {
      opacity: 0.85;
      background: transparent;
      border: none;
    }

    .controls button:active { transform: scale(0.92); }
    .controls button:disabled {
      opacity: 0.28;
      cursor: not-allowed;
    }

    .controls .play {
      width: auto;
      height: auto;
      border: none;
      color: var(--gold);
      font-size: 1.45rem;
      padding: 4px 8px;
    }

    .controls .play:hover {
      border: none;
      background: transparent;
      opacity: 0.9;
    }

    .list-panel {
      width: 100%;
      max-width: 900px;
      margin-top: 14px;
      display: none;
    }

    .list-panel.open { display: block; }

    .list-panel h3 {
      font-size: 0.75rem;
      color: var(--muted);
      margin-bottom: 8px;
      font-weight: 500;
      letter-spacing: 0.04em;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 8px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      cursor: pointer;
      transition: border-color 0.15s;
    }

    .card:hover,
    .card.active { border-color: var(--gold-dim); }

    .card.active { border-color: var(--gold); }

    .card .thumb {
      position: relative;
      aspect-ratio: 16 / 9;
      background: #000;
    }

    .card .thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .card .thumb .num {
      position: absolute;
      top: 3px;
      left: 3px;
      background: rgba(0,0,0,0.65);
      color: #ccc;
      font-size: 0.6rem;
      padding: 1px 4px;
      border-radius: 2px;
    }

    .card .name {
      padding: 4px 6px;
      font-size: 0.7rem;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .status {
      margin-top: 6px;
      font-size: 0.72rem;
      color: var(--muted);
      text-align: center;
    }

    /* 手机竖屏更紧凑 */
    @media (max-width: 600px) {
      body { padding: 8px 6px 20px; }
      .brand { font-size: 0.66rem; margin-bottom: 8px; }
      .controls { gap: 2px 6px; padding: 4px 4px 6px; }
      .controls button { min-width: 32px; min-height: 32px; font-size: 1.15rem; padding: 4px 2px; }
      .controls .play { font-size: 1.35rem; }
      .title-bar { padding: 5px 8px; font-size: 0.7rem; }
      .fs-btn { margin-left: 10px; }
      .folder-btn { margin-left: 4px; }
      .url-inline { margin-left: 10px; min-width: 44px; max-width: 150px; }
      .url-inline input { padding: 4px 6px; font-size: 0.68rem; }
      .url-inline button { min-width: 24px; min-height: 24px; font-size: 0.9rem; }
    }

    /* 横屏：左播放 · 中进度 · 右全屏/缩放，单行不挤 */
    @media (orientation: landscape) {
      body {
        padding: 4px 8px 6px;
        justify-content: flex-start;
      }
      .brand { margin-bottom: 4px; font-size: 0.64rem; }
      .title-bar { padding: 2px 8px; font-size: 0.68rem; }

      /* 上方独立进度条隐藏，并入控制条中间 */
      .progress-area { display: none !important; }
      .controls-center { display: flex; }

      .controls {
        flex-wrap: nowrap;
        gap: 4px;
        padding: 3px 6px 4px;
        min-height: 36px;
      }
      .controls button {
        min-width: 30px;
        min-height: 30px;
        font-size: 1.08rem;
        padding: 2px;
      }
      .controls .play { font-size: 1.22rem; padding: 2px 6px; }
      .fs-btn { margin-left: 10px; }
      .folder-btn { margin-left: 4px; }
      .url-inline { margin-left: 10px; min-width: 44px; max-width: 150px; }
      .url-inline input { padding: 3px 6px; font-size: 0.68rem; }
      .url-inline button { min-width: 24px; min-height: 24px; font-size: 0.9rem; }
      .list-panel { margin-top: 6px; }

      .stage {
        aspect-ratio: auto;
        height: min(72vh, calc(100dvh - 96px));
        max-height: calc(100dvh - 88px);
      }
    }

    /* 矮横屏（手机横过来）再压一点 */
    @media (orientation: landscape) and (max-height: 420px) {
      .brand { margin-bottom: 2px; }
      .title-bar { display: none; }
      .controls { padding: 2px 4px 3px; min-height: 32px; }
      .controls button { min-width: 28px; min-height: 28px; font-size: 1rem; }
      .controls .play { font-size: 1.12rem; }
      .stage {
        height: min(78vh, calc(100dvh - 72px));
        max-height: calc(100dvh - 68px);
      }
    }
  </style>
</head>
<body>

  <div class="brand">
    <span>TP制作🐈📽️</span>
    <span class="clock" id="clock">--月--日 星期- --:--:--</span>
  </div>

  <div class="screen-wrap">
    <div class="screen-inner">
      <div class="title-bar">
        <span class="now" id="nowPlaying">准备播放</span>
      </div>

      <div class="stage-outer">
        <div class="stage" id="stage">
          <video id="player" playsinline></video>
          <iframe id="ytFrame" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
          <div class="placeholder" id="placeholder">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/>
            </svg>
            <span>选择本地视频或粘贴 YouTube 链接</span>
          </div>
        </div>
      </div>

      <div class="progress-area" id="progressArea">
        <div class="progress-bar" id="progressBar">
          <div class="progress-filled" id="progressFilled"></div>
        </div>
        <div class="time-row">
          <span id="currentTime">0:00</span>
          <span id="duration">0:00</span>
        </div>
      </div>

      <!-- 播放控制条：左（上一个/播放/下一个）· 中（进度条，仅横屏显示）· 右（全屏 → 文件夹列表 → YouTube 链接输入） -->
      <div class="controls">
        <div class="controls-left">
          <button id="prevBtn" title="上一个 (←)" disabled>⏮</button>
          <button class="play" id="playBtn" title="播放/暂停 (空格)">▶</button>
          <button id="nextBtn" title="下一个 (→)" disabled>⏭</button>
        </div>
        <div class="controls-center">
          <div class="progress-bar" id="progressBarLand">
            <div class="progress-filled" id="progressFilledLand"></div>
          </div>
          <div class="time-inline">
            <span id="currentTimeLand">0:00</span>
            <span>/</span>
            <span id="durationLand">0:00</span>
          </div>
        </div>
        <div class="controls-right">
          <button id="fsBtn" class="fs-btn" title="全屏 (F)">⛶</button>
          <button id="toggleListBtn" class="folder-btn" title="本地列表">📁</button>
          <div class="url-inline">
            <input type="url" id="urlInput" placeholder="YouTube 链接" />
            <button id="playUrlBtn" title="播放链接">▶</button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="list-panel" id="listPanel">
    <h3>本地视频 · 1.mp4 ~ 56.mp4</h3>
    <div class="grid" id="grid"></div>
    <div class="status" id="status"></div>
  </div>

  <script>
    /*
     * 整体结构：
     * 1. 常量与 DOM 引用
     * 2. IndexedDB 封装（缩略图 thumbs 库 / 播放状态 state 库）
     * 3. 工具函数（时间格式化、YouTube ID 解析、全屏、截图）
     * 4. 显示切换（本地视频 / YouTube iframe / 占位图）
     * 5. 播放控制（上一个/下一个/播放暂停）
     * 6. 本地视频列表卡片渲染
     * 7. 事件绑定（按钮点击、播放器事件、进度条拖拽、键盘快捷键）
     * 8. 启动流程（扫描 1.mp4~56.mp4 → 建列表 → 恢复上次播放状态）
     */
    (() => {
      const MAX = 56;
      const DB_NAME = 'cinema_db';
      const DB_VER = 1;
      const THUMB_MAX_W = 320;
      const THUMB_QUALITY = 0.55;

      // ---- DOM 引用 ----
      const $ = id => document.getElementById(id);
      const urlInput = $('urlInput');
      const playUrlBtn = $('playUrlBtn');
      const toggleListBtn = $('toggleListBtn');
      const listPanel = $('listPanel');
      const grid = $('grid');
      const status = $('status');
      const player = $('player');
      const ytFrame = $('ytFrame');
      const placeholder = $('placeholder');
      const nowPlaying = $('nowPlaying');
      const playBtn = $('playBtn');
      const prevBtn = $('prevBtn');
      const nextBtn = $('nextBtn');
      const progressArea = $('progressArea');
      const progressBar = $('progressBar');
      const progressFilled = $('progressFilled');
      const currentTimeEl = $('currentTime');
      const durationEl = $('duration');
      const progressBarLand = $('progressBarLand');
      const progressFilledLand = $('progressFilledLand');
      const currentTimeLand = $('currentTimeLand');
      const durationLand = $('durationLand');

      const setProgressUI = (pct, cur, dur) => {
        const w = pct + '%';
        progressFilled.style.width = w;
        if (progressFilledLand) progressFilledLand.style.width = w;
        const c = fmt(cur), d = fmt(dur);
        currentTimeEl.textContent = c;
        durationEl.textContent = d;
        if (currentTimeLand) currentTimeLand.textContent = c;
        if (durationLand) durationLand.textContent = d;
      };
      const fsBtn = $('fsBtn');
      const screenWrap = document.querySelector('.screen-wrap');
      const clockEl = $('clock');

      let videoList = [];
      let currentIndex = -1;
      let mode = null;
      const captured = new Set();
      let db = null;

      // ========== 实时时钟（品牌栏右侧）==========
      const WEEKDAYS = ['日', '一', '二', '三', '四', '五', '六'];
      const pad2 = n => String(n).padStart(2, '0');
      const updateClock = () => {
        if (!clockEl) return;
        const now = new Date();
        const month = now.getMonth() + 1;
        const day = now.getDate();
        const week = WEEKDAYS[now.getDay()];
        const h = pad2(now.getHours());
        const m = pad2(now.getMinutes());
        const s = pad2(now.getSeconds());
        clockEl.textContent = `${month}月${day}日 星期${week} ${h}:${m}:${s}`;
      };
      updateClock();
      setInterval(updateClock, 1000);

      // ========== IndexedDB ==========
      // 两个 object store：
      //   thumbs：key = 文件名，value = 缩略图 Blob（用于本地视频列表卡片封面）
      //   state ：key = 'playback'，value = { file, time }，用于刷新后恢复播放进度
      function openDB() {
        return new Promise((resolve, reject) => {
          const req = indexedDB.open(DB_NAME, DB_VER);
          req.onupgradeneeded = e => {
            const database = e.target.result;
            if (!database.objectStoreNames.contains('thumbs')) database.createObjectStore('thumbs');
            if (!database.objectStoreNames.contains('state')) database.createObjectStore('state');
          };
          req.onsuccess = e => resolve(e.target.result);
          req.onerror = e => reject(e.target.error);
        });
      }

      function idbGet(store, key) {
        return new Promise((resolve, reject) => {
          if (!db) return resolve(null);
          const tx = db.transaction(store, 'readonly');
          const req = tx.objectStore(store).get(key);
          req.onsuccess = () => resolve(req.result ?? null);
          req.onerror = () => reject(req.error);
        });
      }

      function idbSet(store, key, value) {
        return new Promise((resolve, reject) => {
          if (!db) return resolve();
          const tx = db.transaction(store, 'readwrite');
          const req = tx.objectStore(store).put(value, key);
          req.onsuccess = () => resolve();
          req.onerror = () => reject(req.error);
        });
      }

      async function getThumbRecord(name) {
        try {
          return await idbGet('thumbs', name);
        } catch {
          return null;
        }
      }

      // 把库里的记录转成可给 <img src> 用的地址（兼容 Blob / dataURL 字符串）
      function recordToSrc(rec) {
        if (!rec) return null;
        try {
          if (typeof rec === 'string') {
            // 旧数据可能是 dataURL
            return { src: rec, blobUrl: null };
          }
          if (rec instanceof Blob) {
            const u = URL.createObjectURL(rec);
            return { src: u, blobUrl: u };
          }
          // 部分浏览器读出 ArrayBuffer
          if (rec instanceof ArrayBuffer || ArrayBuffer.isView(rec)) {
            const blob = new Blob([rec], { type: 'image/jpeg' });
            const u = URL.createObjectURL(blob);
            return { src: u, blobUrl: u };
          }
        } catch (e) {
          console.warn('recordToSrc', e);
        }
        return null;
      }

      async function hasThumb(name) {
        const rec = await getThumbRecord(name);
        return !!rec;
      }

      async function saveThumb(name, dataUrl) {
        try {
          const res = await fetch(dataUrl);
          const blob = await res.blob();
          await idbSet('thumbs', name, blob);
        } catch (e) {
          // 回退：直接存 dataURL 字符串
          try {
            await idbSet('thumbs', name, dataUrl);
          } catch (e2) {
            console.warn('saveThumb', e2);
          }
        }
      }

      async function saveState() {
        if (mode !== 'local' || currentIndex < 0) return;
        try {
          await idbSet('state', 'playback', {
            file: videoList[currentIndex],
            time: player.currentTime || 0
          });
        } catch {}
      }

      async function loadState() {
        try { return await idbGet('state', 'playback'); }
        catch { return null; }
      }

      // ========== 工具 ==========
      const fmt = sec => {
        if (!isFinite(sec)) return '0:00';
        const m = Math.floor(sec / 60);
        const s = Math.floor(sec % 60);
        return m + ':' + String(s).padStart(2, '0');
      };

      const ytId = url => {
        if (!url) return null;
        const m = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([a-zA-Z0-9_-]{11})/);
        return m ? m[1] : null;
      };

      const toggleFullscreen = async () => {
        const el = screenWrap || document.documentElement;
        try {
          if (!document.fullscreenElement && !document.webkitFullscreenElement) {
            if (el.requestFullscreen) await el.requestFullscreen();
            else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
            else if (player.webkitEnterFullscreen) player.webkitEnterFullscreen(); // iOS video
          } else {
            if (document.exitFullscreen) await document.exitFullscreen();
            else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
          }
        } catch (e) {
          // iOS 回退：尝试视频原生全屏
          try {
            if (player.webkitEnterFullscreen) player.webkitEnterFullscreen();
          } catch (_) {}
        }
      };

      // 全屏按钮图标固定不变，仅切换 title 提示文字（进入/退出）
      const syncFsBtn = () => {
        const on = !!(document.fullscreenElement || document.webkitFullscreenElement);
        fsBtn.title = on ? '退出全屏 (F)' : '全屏 (F)';
      };

      // ========== 截图 ==========
      const capture = () => {
        try {
          if (!player.videoWidth) return null;
          const scale = Math.min(1, THUMB_MAX_W / player.videoWidth);
          const w = Math.round(player.videoWidth * scale);
          const h = Math.round(player.videoHeight * scale);
          const c = document.createElement('canvas');
          c.width = w;
          c.height = h;
          c.getContext('2d').drawImage(player, 0, 0, w, h);
          return c.toDataURL('image/jpeg', THUMB_QUALITY);
        } catch { return null; }
      };

      // 更新列表卡片上的缩略图显示
      const applyThumbToCard = (card, srcInfo) => {
        if (!card || !srcInfo || !srcInfo.src) return;
        const thumb = card.querySelector('.thumb');
        if (!thumb) return;
        let img = thumb.querySelector('img');
        if (!img) {
          const ph = thumb.querySelector('.ph');
          if (ph) ph.remove();
          img = document.createElement('img');
          img.alt = card.dataset.file || '';
          const num = thumb.querySelector('.num');
          if (num) thumb.insertBefore(img, num);
          else thumb.appendChild(img);
        }
        if (img.dataset.blobUrl) {
          try { URL.revokeObjectURL(img.dataset.blobUrl); } catch {}
          delete img.dataset.blobUrl;
        }
        if (srcInfo.blobUrl) img.dataset.blobUrl = srcInfo.blobUrl;
        img.src = srcInfo.src;
        img.loading = 'eager';
        img.decoding = 'async';
      };

      const updateCardThumb = async (name) => {
        const card = grid.querySelector(`[data-file="${name}"]`);
        if (!card) return;
        const rec = await getThumbRecord(name);
        const srcInfo = recordToSrc(rec);
        if (srcInfo) applyThumbToCard(card, srcInfo);
      };

      // 启动时 / 打开列表时：把 IndexedDB 里已有缩略图全部刷到卡片上
      const refreshAllThumbs = async () => {
        if (!videoList.length) return;
        await Promise.all(videoList.map(async (name) => {
          const rec = await getThumbRecord(name);
          if (!rec) return;
          captured.add(name);
          const card = grid.querySelector(`[data-file="${name}"]`);
          if (!card) return;
          const srcInfo = recordToSrc(rec);
          if (srcInfo) applyThumbToCard(card, srcInfo);
        }));
      };

      // 将当前画面设为代表图（可覆盖旧图）
      const setThumbFromCurrent = async () => {
        if (mode !== 'local' || currentIndex < 0) return false;
        if (!player.videoWidth) return false;
        const name = videoList[currentIndex];
        const dataUrl = capture();
        if (!dataUrl) return false;
        await saveThumb(name, dataUrl);
        captured.add(name);
        await updateCardThumb(name);
        return true;
      };

      // 自动截图：仅当该视频还没有代表图时
      const tryCapture = async () => {
        if (mode !== 'local' || currentIndex < 0) return;
        const name = videoList[currentIndex];
        if (captured.has(name) || player.currentTime < 0.8) return;
        if (await hasThumb(name)) {
          captured.add(name);
          await updateCardThumb(name);
          return;
        }
        await setThumbFromCurrent();
      };

      // ========== 显示 ==========
      const hideAll = () => {
        player.style.display = 'none';
        ytFrame.style.display = 'none';
        placeholder.style.display = 'none';
      };

      const showLocal = () => {
        hideAll();
        player.style.display = 'block';
        progressArea.classList.add('show');
        mode = 'local';
      };

      const showYT = id => {
        player.pause();
        player.removeAttribute('src');
        player.load();
        hideAll();
        progressArea.classList.remove('show');
        ytFrame.style.display = 'block';
        ytFrame.src = `https://www.youtube.com/embed/${id}?autoplay=1&rel=0`;
        mode = 'youtube';
        currentIndex = -1;
        prevBtn.disabled = true;
        nextBtn.disabled = true;
        playBtn.textContent = '▶';
        grid.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
      };

      const openLocal = (index, restoreTime) => {
        if (index < 0 || index >= videoList.length) return;
        currentIndex = index;
        const file = videoList[index];

        showLocal();
        player.src = file;
        nowPlaying.textContent = file;
        prevBtn.disabled = index <= 0;
        nextBtn.disabled = index >= videoList.length - 1;

        grid.querySelectorAll('.card').forEach(c => {
          c.classList.toggle('active', c.dataset.file === file);
        });

        const onMeta = () => {
          player.removeEventListener('loadedmetadata', onMeta);
          if (typeof restoreTime === 'number' && restoreTime > 0 && restoreTime < player.duration) {
            player.currentTime = restoreTime;
          }
          player.play().catch(() => {});
        };
        player.addEventListener('loadedmetadata', onMeta);
      };

      const togglePlay = () => {
        if (mode !== 'local') return;
        player.paused ? player.play().catch(() => {}) : player.pause();
      };

      const playPrev = () => {
        if (currentIndex > 0) { saveState(); openLocal(currentIndex - 1); }
      };

      const playNext = () => {
        if (currentIndex < videoList.length - 1) { saveState(); openLocal(currentIndex + 1); }
      };

      // ========== 卡片 ==========
      const createCard = async name => {
        const card = document.createElement('div');
        card.className = 'card';
        card.dataset.file = name;

        const thumb = document.createElement('div');
        thumb.className = 'thumb';

        const ph = document.createElement('div');
        ph.className = 'ph';
        ph.style.cssText = 'width:100%;height:100%;background:#0a0e14;display:flex;align-items:center;justify-content:center;color:#3a4a5c;font-size:0.65rem;';
        ph.textContent = '加载中…';
        thumb.appendChild(ph);

        const num = document.createElement('div');
        num.className = 'num';
        num.textContent = name.replace(/\.mp4$/i, '');
        thumb.appendChild(num);

        const label = document.createElement('div');
        label.className = 'name';
        label.textContent = name;

        card.append(thumb, label);

        // 先挂到结构上，再读库显示缩略图
        try {
          const rec = await getThumbRecord(name);
          if (rec) {
            captured.add(name);
            const srcInfo = recordToSrc(rec);
            if (srcInfo) applyThumbToCard(card, srcInfo);
            else ph.textContent = '播放后截图';
          } else {
            ph.textContent = '播放后截图';
          }
        } catch (_) {
          ph.textContent = '播放后截图';
        }

        card.addEventListener('click', () => {
          const i = videoList.indexOf(name);
          if (i >= 0) openLocal(i);
        });
        return card;
      };

      // ========== 事件绑定 ==========
      // -- 顶部/控制条按钮 --
      playUrlBtn.addEventListener('click', () => {
        const id = ytId(urlInput.value.trim());
        if (!id) return alert('无法识别 YouTube 链接');
        nowPlaying.textContent = 'YouTube · ' + id;
        showYT(id);
      });

      urlInput.addEventListener('keydown', e => {
        if (e.key === 'Enter') playUrlBtn.click();
      });

      toggleListBtn.addEventListener('click', () => {
        const open = listPanel.classList.toggle('open');
        toggleListBtn.textContent = open ? '📂' : '📁';
        toggleListBtn.title = open ? '收起列表' : '本地列表';
        if (open) refreshAllThumbs();
      });

      playBtn.addEventListener('click', togglePlay);
      prevBtn.addEventListener('click', playPrev);
      nextBtn.addEventListener('click', playNext);
      fsBtn.addEventListener('click', toggleFullscreen);
      document.addEventListener('fullscreenchange', syncFsBtn);
      document.addEventListener('webkitfullscreenchange', syncFsBtn);

      // -- <video> 播放器事件 --
      player.addEventListener('play', () => { playBtn.textContent = '⏸'; });
      player.addEventListener('pause', () => {
        playBtn.textContent = '▶';
        saveState();
        tryCapture();
      });
      player.addEventListener('ended', () => {
        playBtn.textContent = '▶';
        tryCapture();
      });
      player.addEventListener('timeupdate', () => {
        if (seeking) return; // 拖拽中由拖拽逻辑更新 UI
        const pct = player.duration ? (player.currentTime / player.duration) * 100 : 0;
        setProgressUI(pct, player.currentTime, player.duration || 0);
        tryCapture();
      });
      player.addEventListener('loadedmetadata', () => {
        setProgressUI(
          player.duration ? (player.currentTime / player.duration) * 100 : 0,
          player.currentTime,
          player.duration || 0
        );
      });

      // 双击视频画面 → 设为当前视频代表图（覆盖旧图）
      player.addEventListener('dblclick', async e => {
        e.preventDefault();
        const ok = await setThumbFromCurrent();
        if (ok) {
          // 简短提示
          const prev = nowPlaying.textContent;
          nowPlaying.textContent = '✓ 已设为代表图';
          setTimeout(() => {
            if (nowPlaying.textContent === '✓ 已设为代表图') {
              nowPlaying.textContent = prev;
            }
          }, 1200);
        }
      });

      // -- 进度条点击 + 拖拽（鼠标 / 触摸 / 指针事件三套兼容） --
      let seeking = false;
      let seekBar = null;

      const ratioFromEvent = (bar, e) => {
        const point = e.touches && e.touches[0] ? e.touches[0]
          : (e.changedTouches && e.changedTouches[0] ? e.changedTouches[0] : e);
        const rect = bar.getBoundingClientRect();
        if (rect.width <= 0) return 0;
        return Math.min(1, Math.max(0, (point.clientX - rect.left) / rect.width));
      };

      const applySeek = (bar, e) => {
        if (mode !== 'local' || !bar || !player.duration) return;
        const ratio = ratioFromEvent(bar, e);
        const t = ratio * player.duration;
        player.currentTime = t;
        setProgressUI(ratio * 100, t, player.duration);
      };

      const onSeekStart = (bar, e) => {
        if (mode !== 'local' || !bar) return;
        if (e.cancelable) e.preventDefault();
        seeking = true;
        seekBar = bar;
        bar.classList.add('is-dragging');
        applySeek(bar, e);
      };

      const onSeekMove = (e) => {
        if (!seeking || !seekBar) return;
        if (e.cancelable) e.preventDefault();
        applySeek(seekBar, e);
      };

      const onSeekEnd = (e) => {
        if (!seeking) return;
        if (seekBar && e) applySeek(seekBar, e);
        if (seekBar) seekBar.classList.remove('is-dragging');
        seeking = false;
        seekBar = null;
        saveState();
      };

      const bindSeekBar = (bar) => {
        if (!bar) return;
        bar.addEventListener('pointerdown', (e) => {
          if (e.button != null && e.button !== 0) return;
          try { bar.setPointerCapture(e.pointerId); } catch (_) {}
          onSeekStart(bar, e);
        });
        bar.addEventListener('pointermove', (e) => {
          if (!seeking || seekBar !== bar) return;
          onSeekMove(e);
        });
        bar.addEventListener('pointerup', onSeekEnd);
        bar.addEventListener('pointercancel', onSeekEnd);
        // 兼容部分旧 WebView
        bar.addEventListener('touchstart', (e) => onSeekStart(bar, e), { passive: false });
        bar.addEventListener('touchmove', (e) => {
          if (!seeking || seekBar !== bar) return;
          onSeekMove(e);
        }, { passive: false });
        bar.addEventListener('touchend', onSeekEnd);
        bar.addEventListener('touchcancel', onSeekEnd);
      };

      bindSeekBar(progressBar);
      bindSeekBar(progressBarLand);

      // 拖拽中不由 timeupdate 覆盖进度 UI

      setInterval(saveState, 5000);

      // -- 键盘快捷键（输入框聚焦时不触发，避免和打字冲突） --
      document.addEventListener('keydown', e => {
        if (e.target.tagName === 'INPUT') return;
        switch (e.key) {
          case ' ':
          case 'k':
          case 'K':
            e.preventDefault();
            togglePlay();
            break;
          case 'ArrowLeft':
            e.preventDefault();
            playPrev();
            break;
          case 'ArrowRight':
            e.preventDefault();
            playNext();
            break;
          case 'f':
          case 'F':
            e.preventDefault();
            toggleFullscreen();
            break;
        }
      });

      // ========== 扫描 ==========
      // 单个文件是否存在的探测，timeoutMs 可调（排队等待中的探测需要更长超时）
      const exists = (src, timeoutMs = 8000) => new Promise(resolve => {
        const v = document.createElement('video');
        v.preload = 'metadata';
        v.muted = true;
        v.playsInline = true;
        let settled = false;
        const done = ok => {
          if (settled) return;
          settled = true;
          v.removeAttribute('src');
          v.load();
          resolve(ok);
        };
        v.addEventListener('loadedmetadata', () => done(true));
        v.addEventListener('error', () => done(false));
        setTimeout(() => done(false), timeoutMs);
        v.src = src;
      });

      // 分批扫描，避免一次性并发过多导致浏览器排队、探测超时误判为"不存在"
      const scanNames = async (names, concurrency = 6, timeoutMs = 8000) => {
        const results = new Array(names.length).fill(false);
        let cursor = 0;
        const worker = async () => {
          while (cursor < names.length) {
            const i = cursor++;
            results[i] = await exists(names[i], timeoutMs);
          }
        };
        const workers = Array.from({ length: Math.min(concurrency, names.length) }, worker);
        await Promise.all(workers);
        return results;
      };

      (async () => {
        try { db = await openDB(); } catch (e) { console.warn('IndexedDB', e); }

        const allNames = Array.from({ length: MAX }, (_, i) => (i + 1) + '.mp4');

        // 第一轮：限并发扫描
        let found = await scanNames(allNames, 6, 8000);

        // 第二轮：对第一轮判定为"不存在"的文件再复查一次，进一步降低误判概率
        const missingIdx = found.map((ok, i) => (ok ? -1 : i)).filter(i => i >= 0);
        if (missingIdx.length) {
          const recheckNames = missingIdx.map(i => allNames[i]);
          const recheck = await scanNames(recheckNames, 4, 10000);
          recheck.forEach((ok, k) => { if (ok) found[missingIdx[k]] = true; });
        }

        videoList = allNames.filter((_, i) => found[i]);

        if (!videoList.length) {
          status.textContent = '未发现本地视频（请命名为 1.mp4 ~ 56.mp4）';
          return;
        }

        status.textContent = '共 ' + videoList.length + ' 个本地视频';
        grid.innerHTML = '';
        const cards = await Promise.all(videoList.map(createCard));
        cards.forEach(c => grid.appendChild(c));
        // 再次从 IndexedDB 刷新缩略图，避免首次未显示
        await refreshAllThumbs();

        const state = await loadState();
        if (state?.file && videoList.includes(state.file)) {
          openLocal(videoList.indexOf(state.file), state.time);
        } else {
          openLocal(0);
        }
      })();
    })();
  </script>
</body>
</html>
